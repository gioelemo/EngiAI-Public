[project]
name = "engineer-assistant"
version = "0.1.0"
description = "AI Assistant for Mechanical Engineering Design"
authors = [
    {name = "Gioele Molinari", email = "gioelemo@ethz.ch"}
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy-stl ==3.2.0",
    "langchain ==1.0.2",
    "langchain-core ==1.0.1",
    "langchain-openai ==1.0.1",
    "langchain-tavily",
    "langchain-mcp-adapters==0.1.12",
    "langchain-chroma ==1.0.0",
    "langgraph ==1.0.1",
    "matplotlib ==3.10.6",
    "wandb      ==0.22.2",
    "torch ==2.8.0",
    "torchvision ==0.23.0",
    "torchaudio ==2.8.0",
    "streamlit ==1.50.0",
    "pillow ==11.3.0",
    "streamlit-stl ==0.0.6",
    "fabric ==3.2.2",
    "watchdog ==6.0.0",
    "python-dotenv",
    "engibench",
    "scipy",
    "cvxopt",
    "psycopg2-binary ==2.9.10",
    "sqlalchemy ==2.0.36",
    "langchain-community ==0.4.1",
    "chromadb ==1.3.3",
]

[project.optional-dependencies]
dev = [
  "mypy",
  "ruff",
  "pre-commit",
]
test = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.12.0",
]
all = [
  "mypy",
  "ruff",
  "pre-commit",
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.12.0",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88

# Assume Python 3.11
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "E4",   # pycodestyle errors
    "E7",   # pycodestyle errors
    "E9",   # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    # "T20",  # flake8-print - disabled for example scripts
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate
    "PD",   # pandas-vet
    "PGH",  # pygrep-hooks
    "PL",   # pylint
    "TRY",  # tryceratops
    "FLY",  # flynt
    "NPY",  # numpy
    "AIR",  # airflow
    "PERF", # perflint
    "FURB", # refurb
    "LOG",  # flake8-logging
    "RUF",  # Ruff-specific rules
]

ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]
# Allow print statements in scripts
"scripts/**/*" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (multiple components)",
    "slow: Slow tests (skip with -m 'not slow')",
    "requires_api: Tests requiring real API keys",
]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*:",
    "ignore::UserWarning:pydantic.*:",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
warn_redundant_casts = true
warn_unused_ignores = false
files = ["src/", "tests/"]
exclude = [
  "^build/",
  "^docs/",
]
[[tool.mypy.overrides]]
module = [
  "stl.*",
  "langchain.*",
  "langgraph.*",
  "langchain_core.*",
  "langchain_tavily.*",
  "python-dotenv",
  "dotenv",
  "matplotlib",
  "matplotlib.*",
  "engibench.*",
  "engiopt.*",
  "langchain_experimental.*",
  "wandb",
  "torch",
  "streamlit",
  "pillow",
  "PIL",
  "streamlit_stl",
  "fabric",
  "streamlit.components.*",
  "diffusers",
  "watchdog",
  "langchain-mcp-adapters",
  "sqlalchemy",
  "sqlalchemy.*",
  "mcp",
  "mcp.*",
  "pydantic",
  "langchain_community.*",
  "langchain_chroma",
  "langchain_openai"
]
ignore_missing_imports = true
