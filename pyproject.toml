[project]
name = "engiai"
version = "1.1.0"
description = "AI Assistant for Mechanical Engineering Design"
authors = [
    {name = "Gioele Molinari", email = "gioelemo@ethz.ch"}
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "arxiv==2.4.1",
    "beautifulsoup4==4.12.3",
    "cryptography==46.0.6",
    "cvxopt",
    "elevenlabs>=1.0.0",
    # EngiBench is pinned to a specific commit for reproducibility and because the required fixes are not yet available in a tagged release.
    # When an appropriate tagged version is available, replace this with that tag (for example: engibench==<version>).
    "engibench @ git+https://github.com/IDEALLab/EngiBench.git@5983750dd498cc01e926dc7199f455d928f338ec",
    "engiopt @ git+https://github.com/IDEALLab/EngiOpt.git@127a0469c98886f35e20a54a809278d864369cb5",
    "fabric==3.2.2",
    "flask>=3.0.0",
    "langchain==1.2.13",
    "langchain-community==0.4.1",
    "langchain-core==1.2.23",
    "langchain-google-genai==4.2.1",
    "langchain-mcp-adapters==0.2.2",
    "langchain-ollama==1.0.1",
    "langchain-openai==1.1.12",
    "langchain-tavily==0.2.17",
    "langgraph==1.1.3",
    "langgraph-checkpoint-postgres==3.0.5",
    "matplotlib==3.10.8",
    "nest-asyncio>=1.6.0",
    "numpy-stl==3.2.0",
    "pillow==12.1.1",
    "psycopg[binary]>=3.2.0",
    "reportlab==4.4.10",
    "psycopg2-binary==2.9.11",
    "pyyaml>=6.0",
    "python-dotenv==1.2.2",
    "requests==2.32.5",
    "scipy",
    "sqlalchemy==2.0.48",
    "st-copy==1.1.2",
    "streamlit==1.55.0",
    "streamlit-adjustable-columns==0.2.1",
    "streamlit-stl==0.0.6",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "trimesh>=4.0.0",
    "wandb==0.25.1",
    "watchdog==6.0.0",
    "weave==0.52.35",
]

[project.optional-dependencies]
dev = [
  "mypy",
  "ruff>=0.14.0",
  "pre-commit",
  "types-requests",
]
test = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.12.0",
  "pytest-playwright>=0.6.0",
]
docs = [
    "myst-parser>=2.0.0",
    "sphinx>=7.0.0",
    "sphinx-book-theme>=1.0.0",
]
all = [
  "mypy",
  "ruff>=0.14.0",
  "pre-commit",
  "types-requests",
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.12.0",
  "pytest-playwright>=0.6.0",
  "sphinx>=7.0.0",
  "sphinx-rtd-theme>=2.0.0",
  "myst-parser>=2.0.0",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "benchmarks/shared/metrics.py",
    "thesis",
]

# Same as Black.
line-length = 88

# Assume Python 3.11
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "E4",   # pycodestyle errors
    "E7",   # pycodestyle errors
    "E9",   # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    # "T20",  # flake8-print - disabled for example scripts
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate
    "PD",   # pandas-vet
    "PGH",  # pygrep-hooks
    "PL",   # pylint
    "TRY",  # tryceratops
    "FLY",  # flynt
    "NPY",  # numpy
    "AIR",  # airflow
    "PERF", # perflint
    "FURB", # refurb
    "LOG",  # flake8-logging
    "RUF",  # Ruff-specific rules
]

ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
    "TRY003", # long messages outside the exception class
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
known-first-party = ["src", "config", "prusa_mcp_server", "services"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, relative imports, imports in functions, unused args, and many args
"tests/**/*" = [
    "PLR2004",  # magic-value-comparison
    "S101",     # assert
    "TID252",   # relative-imports
    "PLC0415",  # import-outside-toplevel - test imports intentionally inside functions
    "ARG002",   # unused-method-argument - mock parameters required by @patch decorators
    "PLR0913",  # too-many-arguments - pytest fixtures can have many parameters
    "N806",     # non-lowercase-variable-in-function - mock variables use PascalCase
    "F841",     # unused-variable - some test fixtures create variables for mocking
    "SIM117",   # multiple-with-statements - sometimes clearer as nested in tests
]
# Allow print statements and numeric module names in scripts
"scripts/**/*" = ["T20", "N999"]
# Prompt generation uses keyword-only args with sensible defaults, 6 params is reasonable
"benchmarks/shared/prompt_generation.py" = ["PLR0913"]
# Plot scripts use sys.path guard before benchmarks.* imports for standalone execution
"benchmarks/evaluations/plots/*.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = [".", "services"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (multiple components)",
    "slow: Slow tests (skip with -m 'not slow')",
    "requires_api: Tests requiring real API keys",
    "asyncio: Async tests",
    "e2e: Full-browser Playwright tests (require a running Streamlit server)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*:",
    "ignore::UserWarning:pydantic.*:",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src/**", "tests/**", "scripts/**", "benchmarks/**", "services/**"]
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "build",
  "docs",
  "benchmarks/shared/metrics.py",
]
enableTypeIgnoreComments = true
reportMissingImports = "none"
reportMissingModuleSource = "none"  # CI doesn't install all optional deps
reportGeneralTypeIssues = "none"  # -> commented out raises a lot of errors
reportUnboundVariable = "warning"

[tool.mypy]
mypy_path = [".", "services"]
warn_redundant_casts = true
warn_unused_ignores = false
files = ["src/", "tests/", "scripts/", "benchmarks/", "services/"]
exclude = [
  "build",
  "docs",
  "benchmarks/shared/metrics.py",
  "src/ui/components/excalidraw",
]
[[tool.mypy.overrides]]
module = [
  "arxiv",
  "bs4",
  "beautifulsoup4",
  "benchmarks.shared.metrics",
  "cryptography.*",
  "datasets",
  "diffusers",
  "dotenv",
  "elevenlabs",
  "elevenlabs.*",
  "engibench.*",
  "engiopt.*",
  "fabric",
  "flask",
  "httpx",
  "langchain.*",
  "langchain-mcp-adapters",
  "langchain_chroma",
  "langchain_community.*",
  "langchain_core.*",
  "langchain_experimental.*",
  "langchain_openai",
  "langchain_tavily.*",
  "langgraph.*",
  "matplotlib",
  "matplotlib.*",
  "mcp",
  "mcp.*",
  "mpl_toolkits.*",
  "nest_asyncio",
  "openai",
  "openai.*",
  "pandas",
  "pandas.*",
  "PIL",
  "playwright.*",
  "pillow",
  "pydantic",
  "python-dotenv",
  "reportlab",
  "reportlab.*",
  "scipy",
  "scipy.*",
  "seaborn",
  "seaborn.*",
  "sqlalchemy",
  "sqlalchemy.*",
  "src.ui.components.excalidraw",
  "src.ui.components.excalidraw.*",
  "stl.*",
  "streamlit",
  "streamlit.components.*",
  "streamlit_adjustable_columns",
  "streamlit_stl",
  "st_copy",
  "torch",
  "trimesh",
  "trimesh.*",
  "uvicorn",
  "wandb",
  "wandb.*",
  "watchdog",
  "weave",
  "weave.*",
  "yaml",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "benchmarks.shared.metrics"
ignore_errors = true
