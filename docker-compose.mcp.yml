services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: engineer-assistant-postgres
    environment:
      - POSTGRES_DB=engineer_assistant
      - POSTGRES_USER=engiai_user
      - POSTGRES_PASSWORD=engineer_ai_2025
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engiai_user -d engineer_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - engineer-assistant

  # Standalone Prusa MCP Server
  prusa-mcp-server:
    build:
      context: .
      dockerfile: prusa_mcp_server/Dockerfile
    container_name: prusa-mcp-server
    ports:
      - "8765:8000"  # Map host 8765 to container 8000 (FastMCP default)
    environment:
      - PRUSA_MCP_PATH=/app/prusa-mcp
      - PRUSA_EMAIL=${PRUSA_EMAIL:-}
      - PRUSA_PASSWORD=${PRUSA_PASSWORD:-}
      - PRUSA_CONNECT_URL=${PRUSA_CONNECT_URL:-https://connect.prusa3d.com}
      - PRUSA_CONNECT_STATE=/app/data/connect_state.json
      - HEADLESS=${HEADLESS:-1}
    volumes:
      # Mount data directory to persist connect state
      - ./data:/app/data
      # Mount the original prusa-mcp folder (configurable via PRUSA_MCP_LOCAL_PATH in .env)
      - ${PRUSA_MCP_LOCAL_PATH:-~/Desktop/prusa-mcp}:/app/prusa-mcp:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 8000)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - engineer-assistant

  # Main chatbot application (connects to external MCP server)
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: engineer-assistant-chatbot
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - MATHPIX_API_ID=${MATHPIX_API_ID:-}
      - MATHPIX_API_KEY=${MATHPIX_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-openai:gpt-4o}
      - SKIP_MCP=false  # Enable MCP client
      - PRUSA_MCP_URL=http://prusa-mcp-server:8000  # Connect to MCP server (internal port)
      - LANGCHAIN_TRACING=${LANGCHAIN_TRACING:-false}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT:-https://api.smith.langchain.com}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-}
      - WANDB_ENTITY=${WANDB_ENTITY:-}
      - WANDB_REPORT_URL=${WANDB_REPORT_URL:-}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/conversations.db}
      - SSH_AUTH_SOCK=/ssh-agent
      - PAPERS_SOURCE_DIR=/app/papers
      - PAPERS_SOURCE_DIR_HOST=${PAPERS_SOURCE_DIR:-Not configured}
      - PAPERS_STATE_FILE=${PAPERS_STATE_FILE:-data/local_import_state.json}
      - PAPERS_COLLECTION=${PAPERS_COLLECTION:-engineer_docs}
    volumes:
      - ./data:/app/data
      - ~/.ssh:/root/.ssh-host:ro
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
      # Mount papers directory for bulk import (host path configurable via PAPERS_SOURCE_DIR in .env)
      # Inside container, papers are always at /app/papers
      - ${PAPERS_SOURCE_DIR:-./papers}:/app/papers:ro
    depends_on:
      postgres:
        condition: service_healthy
      prusa-mcp-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - engineer-assistant

networks:
  engineer-assistant:
    driver: bridge

volumes:
  postgres_data:
