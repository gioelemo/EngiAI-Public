services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: engineer-assistant-postgres
    environment:
      - POSTGRES_DB=engineer_assistant
      - POSTGRES_USER=engiai_user
      - POSTGRES_PASSWORD=engineer_ai_2025
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engiai_user -d engineer_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - engineer-assistant

  # Standalone Prusa MCP Server
  prusa-mcp-server:
    build:
      context: .
      dockerfile: prusa_mcp_server/Dockerfile
    container_name: prusa-mcp-server
    ports:
      - "8765:8765"  # Map host 8765 to container 8765
    env_file:
      - .env  # Load all environment variables from .env file
    environment:
      # Override specific variables for MCP server
      - PRUSA_MCP_PATH=/app/prusa-mcp
      - PRUSA_MCP_PORT=8765  # Run on port 8765 inside container
      - PRUSA_CONNECT_STATE=/app/data/connect_state.json
    volumes:
      # Mount data directory to persist connect state
      - ./data:/app/data
      # Mount the original prusa-mcp folder (configurable via PRUSA_MCP_LOCAL_PATH in .env)
      - ${PRUSA_MCP_LOCAL_PATH:-~/Desktop/prusa-mcp}:/app/prusa-mcp:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 8765)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - engineer-assistant

  # MMORE RAG Service for multimodal document processing
  mmore-rag-service:
    build:
      context: ${MMORE_PATH:-~/Desktop/mmore}
      dockerfile: Dockerfile
      platforms:
        - linux/arm64  # Build for Apple Silicon
    container_name: mmore-rag-service
    ports:
      - "8000:8000"  # FastAPI server port
    environment:
      - MMORE_CONFIG_PATH=/app/config/retriever_config.yaml
      - MMORE_API_HOST=0.0.0.0
      - MMORE_API_PORT=8000
    volumes:
      # Persist Milvus Lite database
      - ${MMORE_PATH:-~/Desktop/mmore}/proc_demo.db:/app/proc_demo.db
      # Mount config
      - ${MMORE_PATH:-~/Desktop/mmore}/examples/retriever_api/config.yaml:/app/config/retriever_config.yaml:ro
      # Persist uploads and cache (correct path for mmoreuser home)
      - ./data/mmore/uploads:/app/uploads
      - ./data/mmore/cache:/home/mmoreuser/.cache
    # Removed memory limits - let Docker use available resources for model loading
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "cd /app &&
      . .venv/bin/activate &&
      python -m mmore.run_live_retrieval
      --config-file /app/config/retriever_config.yaml
      --host 0.0.0.0
      --port 8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s  # 3 minutes for model downloads on first start
    networks:
      - engineer-assistant

  # Main chatbot application (connects to external MCP server)
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: engineer-assistant-chatbot
    ports:
      - "8501:8501"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # For Linux support
    env_file:
      - .env  # Load all environment variables from .env file
    environment:
      # Override specific variables for Docker deployment with MCP
      - SKIP_MCP=false  # Enable MCP client
      - PRUSA_MCP_URL=http://prusa-mcp-server:8765  # Connect to MCP server (internal port)
      - MMORE_RAG_URL=http://mmore-rag-service:8000  # Connect to mmore RAG service
      - DATABASE_URL=${DATABASE_URL:-postgresql://engiai_user:engineer_ai_2025@postgres:5432/engineer_assistant}
      - SSH_AUTH_SOCK=/ssh-agent
      - PAPERS_SOURCE_DIR=/app/papers  # Container path (different from host)
      - TZ=Europe/Zurich  # Set timezone to match host
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./artifacts:/app/artifacts
      - ~/.ssh:/root/.ssh-host:ro
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
      # Mount timezone data to ensure correct timezone in container
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # Mount papers directory for bulk import (host path configurable via PAPERS_SOURCE_DIR in .env)
      # Inside container, papers are always at /app/papers
      - ${PAPERS_SOURCE_DIR:-./papers}:/app/papers:ro
    depends_on:
      postgres:
        condition: service_healthy
      prusa-mcp-server:
        condition: service_healthy
      mmore-rag-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - engineer-assistant

networks:
  engineer-assistant:
    driver: bridge

volumes:
  postgres_data:
