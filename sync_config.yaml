# Thesis sync configuration
# Maps source paths in engineer-assistant to target paths in the thesis submodule.
# Edit target paths here when you reorganize your thesis LaTeX structure.

thesis_submodule_path: thesis

# ---------------------------------------------------------------------------
# Figures
# ---------------------------------------------------------------------------
figures:
  primary_source: benchmarks/evaluations/plots/figures
  mappings: []

  # Architecture diagrams from assets/ -> thesis/figures/
  extra_sources:
    - source: "assets"
      target: "figures"
      extensions: [".pdf"]
      files:
        - "architecture_simplified.pdf"
        - "deployment_simplified.pdf"
        - "design_process.pdf"

    # RAG evaluation figures (RAG-on vs Empty RAG vs RAG-off)
    - source: "benchmarks/evaluations/plots/figures/rag_beams2d/rag-eval"
      target: "figures/benchmark/rag"
      extensions: [".pdf"]
      files:
        - "rag_score_components_by_prompt.pdf"

    # --- Workflow figures (main results) ---

    # Full style: CO violin + tool counts heatmap + performance by tools
    - source: "benchmarks/evaluations/plots/figures/beams2d/full/no_rag"
      target: "figures/benchmark/workflow/full"
      extensions: [".pdf"]
      files:
        - "combined_overall_score_distribution.pdf"
        - "tool_usage_heatmap_counts.pdf"
        - "performance_by_tools_overall.pdf"

    # Natural style: tool counts heatmap + performance by tools (main results)
    - source: "benchmarks/evaluations/plots/figures/beams2d/natural/no_rag"
      target: "figures/benchmark/workflow/natural"
      extensions: [".pdf"]
      files:
        - "tool_usage_heatmap_counts.pdf"
        - "performance_by_tools_overall.pdf"

    # Workflow-conditional: CO violin + tool counts heatmap + performance by tools
    - source: "benchmarks/evaluations/plots/figures/beams2d/workflow-conditional/no_rag"
      target: "figures/benchmark/workflow/workflow-conditional"
      extensions: [".pdf"]
      files:
        - "combined_overall_score_distribution.pdf"
        - "tool_usage_heatmap_counts.pdf"
        - "performance_by_tools_overall.pdf"

    # --- Workflow figures (appendix: remaining tool counts heatmaps) ---

    - source: "benchmarks/evaluations/plots/figures/beams2d/workflow-random/no_rag"
      target: "figures/benchmark/workflow/workflow-random"
      extensions: [".pdf"]
      files:
        - "tool_usage_heatmap_counts.pdf"
        - "performance_by_tools_overall.pdf"
        - "co_vs_dq_by_tools.pdf"

    - source: "benchmarks/evaluations/plots/figures/beams2d/workflow-derived-params/no_rag"
      target: "figures/benchmark/workflow/workflow-derived-params"
      extensions: [".pdf"]
      files:
        - "tool_usage_heatmap_counts.pdf"
        - "performance_by_tools_overall.pdf"

    - source: "benchmarks/evaluations/plots/figures/beams2d/workflow-distractor/no_rag"
      target: "figures/benchmark/workflow/workflow-distractor"
      extensions: [".pdf"]
      files:
        - "tool_usage_heatmap_counts.pdf"
        - "performance_by_tools_overall.pdf"

    - source: "benchmarks/evaluations/plots/figures/beams2d/workflow-multi-export/no_rag"
      target: "figures/benchmark/workflow/workflow-multi-export"
      extensions: [".pdf"]
      files:
        - "tool_usage_heatmap_counts.pdf"
        - "performance_by_tools_overall.pdf"

    # HPC training evaluation figures
    - source: "benchmarks/evaluations/plots/figures/hpc_train_beams2d/hpc-train-natural-cgan/no_rag"
      target: "figures/benchmark/hpc"
      extensions: [".pdf"]
      files:
        - "step_completion_heatmap.pdf"
        - "evaluation_metrics.pdf"
        - "baseline_COG_cgan.pdf"
        - "baseline_IOG_cgan.pdf"
        - "baseline_FOG_cgan.pdf"
        - "baseline_MMD_cgan.pdf"
        - "baseline_DPP_cgan.pdf"
        - "baseline_viol_cgan.pdf"

# ---------------------------------------------------------------------------
# LaTeX tables
# ---------------------------------------------------------------------------
tables:
  # Copy pre-generated .tex/.csv table files.
  mappings: []
    # Example:
    # - source: "benchmarks/evaluations/plots/figures_full_evaluation_v1/beams2d/full/no_rag/summary_statistics.tex"
    #   target: "tables/summary_full.tex"

  # Run commands that produce .tex files.  {target} is replaced with the
  # absolute path inside the thesis submodule.
  generators:
    - command: "python benchmarks/evaluations/generate_latex_table.py --problem beams2d --rag-status no_rag --output {target}"
      target: "tables/workflow_results.tex"

# ---------------------------------------------------------------------------
# Prompts  (overwrites TODO placeholders inside appendix.tex)
# ---------------------------------------------------------------------------
prompts:
  target_file: "appendix.tex"

  # Agent system prompts.
  # Keys = label suffix in appendix.tex (e.g. "supervisor" -> \label{subsubsec:supervisorsysprompt})
  # Values = attribute or function name in src/utils/prompts.py
  agent_prompts:
    supervisor: "SUPERVISOR_AGENT_SYSTEM_PROMPT"
    engineer: "_build_engineering_agent_prompt"
    search: "SEARCH_AGENT_SYSTEM_PROMPT"
    rag: "build_rag_agent_prompt"
    arxiv: "ARXIV_AGENT_SYSTEM_PROMPT"
    hpc: "get_hpc_agent_system_prompt"
    cli: "CLI_AGENT_SYSTEM_PROMPT"
    prusa: "PRUSA_AGENT_SYSTEM_PROMPT"

  # Workflow prompt examples (Full, Natural, and all workflow variants).
  # Generated from benchmarks/problems/beams2d/generate_prompts.py with
  # representative params (volfrac=0.4, forcedist=0.65, rmin=4.0, seed=42).
  workflow_prompts:
    source: "benchmarks/problems/beams2d/generate_prompts.py"

  # Benchmark prompts (P0-P3 RAG evaluation prompt examples).
  # Extracted from benchmarks/problems/rag_beams2d/generate_prompts.py:RAG_PROMPTS
  benchmark_prompts:
    source: "benchmarks/problems/rag_beams2d/generate_prompts.py"
