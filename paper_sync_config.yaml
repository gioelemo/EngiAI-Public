# Paper sync configuration
# Maps source prompts to target locations in the ASME paper LaTeX file.

paper_submodule_path: paper/asmeconf
target_file: asmeconf-template.tex

prompts:
  # Workflow prompt examples (7 styles).
  # Generated from benchmarks/problems/beams2d/generate_prompts.py with
  # representative params.
  workflow_prompts:
    source: benchmarks/problems/beams2d/generate_prompts.py
    params:
      volfrac: 0.4
      forcedist: 0.65
      rmin: 4.0
      seed: 42

  # Supervisor agent system prompt.
  supervisor_prompt:
    source: src/utils/prompts.py
    attribute: SUPERVISOR_AGENT_SYSTEM_PROMPT

  # HPC training prompts (explicit + natural, seed=1, epochs=100, cGAN).
  hpc_prompts:
    source: benchmarks/problems/hpc_train_beams2d/generate_prompts.py

  # RAG evaluation prompts (P0 = easiest, P3 = hardest).
  rag_prompts:
    source: benchmarks/problems/rag_beams2d/generate_prompts.py
    indices: [0, 1, 2, 3]
