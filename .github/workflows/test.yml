---
name: Python tests

on:
  push:
    branches: [ main, UI ]
  pull_request:
    branches: [ main ]

jobs:
  linux-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pipx install uv
        uv pip install --system --prerelease=allow -e .[all]
    - name: Full Python tests
      env:
        OPENAI_API_KEY: test-key-123
        TAVILY_API_KEY: test-key-456
        SKIP_MCP: "true"
      run: |
        pytest -v -m "not slow"
