name: e2e

on:
  workflow_dispatch:  # manual trigger only — run before releases

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[test]" --quiet

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run e2e tests
        run: pytest tests/e2e/ -m e2e -v
        env:
          SKIP_MCP: "true"
          SKIP_MMORE: "true"
          TESTING: "true"
          USE_WEAVE: "false"
          LANGCHAIN_TRACING_V2: "false"
          OPENAI_API_KEY: "sk-e2e-placeholder"
          GOOGLE_API_KEY: "fake-google-key"
          TAVILY_API_KEY: "tvly-e2e-placeholder"
