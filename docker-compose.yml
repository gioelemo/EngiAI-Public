services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: engiai-postgres
    environment:
      - POSTGRES_DB=engineer_assistant
      - POSTGRES_USER=engiai_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engiai_user -d engineer_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - engiai

  # Standalone Prusa MCP Server
  prusa-mcp-server:
    build:
      context: .
      dockerfile: services/prusa_mcp_server/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.13}
    image: prusa-mcp-server:latest
    pull_policy: never
    container_name: prusa-mcp-server
    ports:
      - "8765:8765"  # Map host 8765 to container 8765
    env_file:
      - .env  # Load all environment variables from .env file
    environment:
      - PRUSA_MCP_PORT=8765  # Run on port 8765 inside container
      # OAuth2 token file shared with the host — run `make prusa-login`
      # on the host to populate it, the container refreshes tokens in place.
      - PRUSA_TOKEN_FILE=/app/data/prusa_tokens.json
    volumes:
      # Mount data directory to share the OAuth token file with the host
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 8765)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - engiai

  # MMORE RAG Service for multimodal document processing
  mmore-rag-service:
    build:
      context: ${MMORE_PATH:-~/Desktop/mmore}
      dockerfile: Dockerfile
      args:
        PLATFORM: cpu  # Use CPU-only build for macOS (smaller image, no GPU support)
    image: mmore-rag-service:latest
    pull_policy: never
    container_name: mmore-rag-service
    ports:
      - "8000:8000"  # FastAPI server port
    environment:
      - MMORE_CONFIG_PATH=/app/config/retriever_config.yaml
      - MMORE_API_HOST=0.0.0.0
      - MMORE_API_PORT=8000
    volumes:
      # Persist Milvus Lite database
      - ${MMORE_PATH:-~/Desktop/mmore}/proc_demo.db:/app/proc_demo.db
      # Mount config
      - ${MMORE_PATH:-~/Desktop/mmore}/examples/retriever_api/config.yaml:/app/config/retriever_config.yaml:ro
      # Persist uploads and cache (correct path for mmoreuser home)
      - mmore_uploads:/app/uploads
      - mmore_cache:/home/mmoreuser/.cache
    # Removed memory limits - let Docker use available resources for model loading
    user: root  # Run as root to fix volume permissions, then switch to mmoreuser
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "chown -R mmoreuser:mmoreuser /app/uploads /home/mmoreuser/.cache &&
      su mmoreuser -c 'cd /app && . .venv/bin/activate &&
      pip install --quiet \"setuptools<72\" &&
      python -m mmore.run_live_retrieval
      --config-file /app/config/retriever_config.yaml
      --host 0.0.0.0
      --port 8000'"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 240s  # 4 minutes for model downloads on first start
    networks:
      - engiai

  # Main chatbot application (connects to external MCP server)
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.13}
    image: engiai-chatbot:latest
    pull_policy: never
    container_name: engiai-chatbot
    ports:
      - "8501:8501"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # For Linux support
    env_file:
      - .env  # Load all environment variables from .env file
    environment:
      # Override specific variables for Docker deployment with MCP
      - SKIP_MCP=false  # Enable MCP client
      - PRUSA_MCP_URL=http://prusa-mcp-server:8765  # Connect to MCP server (internal port)
      - MMORE_RAG_URL=http://mmore-rag-service:8000  # Connect to mmore RAG service
      - DATABASE_URL=${DATABASE_URL:-postgresql://engiai_user:${POSTGRES_PASSWORD:-change_me}@postgres:5432/engineer_assistant}
      - SSH_AUTH_SOCK=/ssh-agent
      - PAPERS_SOURCE_DIR=/app/papers  # Container path (different from host)
      - TZ=Europe/Zurich  # Set timezone to match host
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./artifacts:/app/artifacts
      - ~/.ssh:/root/.ssh-host:ro
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
      # Mount timezone data to ensure correct timezone in container
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # Mount papers directory for bulk import (host path configurable via PAPERS_SOURCE_DIR in .env)
      # Inside container, papers are always at /app/papers
      - ${PAPERS_SOURCE_DIR:-./papers}:/app/papers:ro
    depends_on:
      postgres:
        condition: service_healthy
      prusa-mcp-server:
        condition: service_healthy
      mmore-rag-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - engiai

networks:
  engiai:
    driver: bridge

volumes:
  postgres_data:
    name: engiai_postgres_data
    external: true
  mmore_cache:
    name: engiai_mmore_cache
    external: true
  mmore_uploads:
    name: engiai_mmore_uploads
    external: true
