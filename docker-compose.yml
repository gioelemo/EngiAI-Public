services:
  chatbot:
    build: .
    container_name: engineer-assistant-chatbot
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - MATHPIX_API_ID=${MATHPIX_API_ID:-}
      - MATHPIX_API_KEY=${MATHPIX_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-openai:gpt-4o}
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL:-text-embedding-3-small}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/conversations.db}
      - LANGCHAIN_TRACING=${LANGCHAIN_TRACING:-false}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT:-https://api.smith.langchain.com}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-}
      - WANDB_ENTITY=${WANDB_ENTITY:-}
      - WANDB_REPORT_URL=${WANDB_REPORT_URL:-}
      - SKIP_MCP=${SKIP_MCP:-true}
      - SSH_AUTH_SOCK=/ssh-agent
    volumes:
      # Mount data directory for persistent storage
      - ./data:/app/data
      # Mount SSH configuration for HPC cluster access
      # Mounted to temporary location, entrypoint script will copy with proper permissions
      - ${HOME}/.ssh:/root/.ssh-host:ro
      # Mount SSH agent socket for passphrase-protected keys (Mac/Linux)
      # This allows the container to use your host's SSH agent
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
